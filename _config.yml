title: Wassim Boussebha Abdessamed
url: https://wassim31.github.io
email: wassim.boussebha@imt-atlantique.fr
author:
  name: Wassim Boussebha Abdessamed
  email: wassim.boussebha@imt-atlantique.fr
tagline: Operating Systems & Low-Level Systems Researcher
description: PhD researcher at IMT Atlantique passionate about operating systems, Linux kernel internals, filesystems, and networking. Working close to the system with C, Go, Linux, and eBPF.
logo: /face.jpg
defaults:
  - scope:
      path: ""
    values:
      image: /face.jpg
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives

jekyll-archives:
  enabled:
    - year
    - month
  layout: archive
  permalinks:
    year: '/:year/'
    month: '/:year/:month/'

exclude:
  - .ruby-lsp
  - POST_TEMPLATE.md
